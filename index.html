<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SHAAN.XV</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#050505;
      overflow:hidden;
      color:white;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
    }

    /* Animated Background Glow */

    .bg-glow{
      position:absolute;
      width:700px;
      height:700px;
      background:radial-gradient(circle, rgba(255,255,255,0.05), transparent 70%);
      filter:blur(100px);
      animation:float 10s ease-in-out infinite;
    }

    @keyframes float{
      0%{ transform:translateY(0px);}
      50%{ transform:translateY(-35px);}
      100%{ transform:translateY(0px);}
    }

    /* Noise Overlay */

    body::after{
      content:'';
      position:absolute;
      width:100%;
      height:100%;
      background-image:url("https://grainy-gradients.vercel.app/noise.svg");
      opacity:0.03;
      pointer-events:none;
    }

    /* Cursor Glow */

    .cursor{
      position:absolute;
      width:300px;
      height:300px;
      background:radial-gradient(circle, rgba(255,255,255,0.06), transparent 70%);
      border-radius:50%;
      pointer-events:none;
      transform:translate(-50%,-50%);
      z-index:1;
      mix-blend-mode:screen;
    }

    /* Main Card */

    .card{
      width:380px;
      padding:45px;
      border-radius:28px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(20px);
      position:relative;
      z-index:5;
      text-align:center;

      box-shadow:
      0 0 30px rgba(255,255,255,0.03),
      0 0 80px rgba(0,0,0,0.8);
    }

    .online{
      width:11px;
      height:11px;
      background:#7dff92;
      border-radius:50%;
      margin:auto;
      margin-bottom:20px;
      box-shadow:0 0 12px #7dff92;
      animation:pulse 2s infinite;
    }

    @keyframes pulse{
      0%{opacity:0.5;}
      50%{opacity:1;}
      100%{opacity:0.5;}
    }

    h1{
      font-size:42px;
      letter-spacing:6px;
      margin-bottom:12px;
      font-weight:600;
    }

    .subtitle{
      font-size:12px;
      letter-spacing:4px;
      color:#9b9b9b;
      margin-bottom:28px;
      text-transform:uppercase;
    }

    .quote{
      font-size:14px;
      line-height:1.8;
      color:#d0d0d0;
      opacity:0.85;
      margin-bottom:35px;
    }

    .links{
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .links a{
      text-decoration:none;
      color:white;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.02);
      padding:14px;
      border-radius:16px;
      transition:0.35s ease;
      letter-spacing:1px;
      font-size:14px;
      position:relative;
      overflow:hidden;
    }

    .links a:hover{
      background:white;
      color:black;
      transform:translateY(-3px);
      box-shadow:0 0 25px rgba(255,255,255,0.15);
    }

    .footer{
      margin-top:35px;
      font-size:11px;
      letter-spacing:3px;
      color:#666;
    }

    /* Popup */

    .popup{
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%) scale(0.8);
      width:420px;
      padding:40px;
      border-radius:24px;
      background:#0c0c0c;
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(30px);
      z-index:100;
      opacity:0;
      pointer-events:none;
      transition:0.4s ease;
      text-align:center;
      box-shadow:0 0 80px rgba(0,0,0,0.8);
    }

    .popup.active{
      opacity:1;
      pointer-events:auto;
      transform:translate(-50%,-50%) scale(1);
    }

    .popup h2{
      font-size:28px;
      letter-spacing:3px;
      margin-bottom:15px;
    }

    .popup p{
      color:#bdbdbd;
      line-height:1.8;
      font-size:14px;
      margin-bottom:25px;
    }

    .close-btn{
      padding:12px 24px;
      border:none;
      background:white;
      color:black;
      border-radius:12px;
      cursor:pointer;
      font-weight:600;
      transition:0.3s ease;
    }

    .close-btn:hover{
      transform:scale(1.05);
    }

  </style>
</head>
<body>

<div class="bg-glow"></div>
<div class="cursor"></div>

<div class="card">

  <div class="online"></div>

  <h1>SHAAN.XV</h1>

  <div class="subtitle">
    PRIVATE ACCESS / AFTER HOURS
  </div>

  <div class="quote">
    “Some people talk luxury.<br>
    Others become it.”
  </div>

  <div class="links">

    <!-- PUT YOUR INSTAGRAM LINK BELOW -->
    <a href="https://www.instagram.com/shaan.xv?igsh=N2pkMXllMjh3OGM3" target="_blank">
      Instagram
    </a>

    <!-- PUT YOUR SPOTIFY LINK BELOW -->
    <a href="https://spotify.com" target="_blank">
      Spotify
    </a>

    <a href="#" id="galleryBtn">
      Gallery
    </a>

  </div>

  <div class="footer">
    EST. MIDNIGHT
  </div>

</div>

<!-- POPUP -->

<div class="popup" id="popup">

  <h2>INTERESTED?</h2>

  <p>
    Seems like you’re interested in me.<br><br>

    Not everyone gets access here.<br>
    Luxury is private.<br>
    Mystery is expensive.<br><br>

    You stayed long enough to notice.
  </p>

  <button class="close-btn" id="closePopup">
    Close
  </button>

</div>

<script>

  // CURSOR EFFECT

  const cursor = document.querySelector('.cursor');

  document.addEventListener('mousemove', (e)=>{
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  });

  // POPUP

  const galleryBtn = document.getElementById('galleryBtn');
  const popup = document.getElementById('popup');
  const closePopup = document.getElementById('closePopup');

  galleryBtn.addEventListener('click', (e)=>{
    e.preventDefault();
    popup.classList.add('active');
  });

  closePopup.addEventListener('click', ()=>{
    popup.classList.remove('active');
  });

</script>

</body>
</html>
